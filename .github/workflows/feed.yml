name: Atualizar feed do Google

on:
  schedule:
    # Todo dia às 05:17 de Brasília (08:17 UTC)
    - cron: "17 8 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}feed-google.xml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar feed a partir do XML da Loja Integrada
        run: node gerar-feed.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
